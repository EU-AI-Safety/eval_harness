[project]
name = "eu-guard-eval-harness"
version = "0.1.0"
description = "Evaluation harness for EU-Guard benchmark generation, judging, and reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "anthropic",
]

[project.optional-dependencies]
vllm = [
    "vllm",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { eval_harness = "." }
packages = ["eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["."]
